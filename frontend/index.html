<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa MKDdigital 🎟️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #cbd5e1;
            margin: 0;
            padding: 0;
            color: #0f172a;
        }

        .header-rifa {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid #f59e0b;
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.7);
            position: relative;
            z-index: 10;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .dado-flotante {
            display: inline-block;
            font-size: 38px;
            animation: float 3s ease-in-out infinite;
            margin-bottom: 2px;
        }

        .marca-rifa {
            font-size: 13px;
            letter-spacing: 3px;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .titulo-rifa {
            margin: 0 0 15px 0;
            font-family: 'Impact', Charcoal, sans-serif;
            font-size: 38px;
            font-weight: 400;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 5px 0 rgba(0,0,0,0.5), 0 10px 10px rgba(0,0,0,0.8);
        }

        .caja-info {
            display: inline-flex;
            flex-direction: column;
            gap: 8px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            padding: 12px 25px;
            border-radius: 30px;
            border: 2px solid #475569;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 5px 15px rgba(0,0,0,0.5);
        }

        #grid-boletos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 12px;
            padding: 25px;
            max-width: 950px;
            margin: 0 auto;
        }

        .ticket {
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            padding: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .disponible { 
            background-color: #059669; 
            color: #ffffff; 
            border: 1px solid #000000;
        }
        .disponible:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            background-color: #047857;
        }

        .reservado { 
            background-color: #d97706; 
            color: white; 
            pointer-events: none; 
            border: 1px solid #000000;
            opacity: 0.9;
        }

        .pagado { 
            background-color: #dc2626; 
            color: white; 
            pointer-events: none; 
            border: 1px solid #000000;
            opacity: 0.9;
        }

        .estado-texto {
            font-size: 9px;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #ffffff; color: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: left;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content input[type="text"],
        .modal-content input[type="tel"],
        .modal-content input[type="email"],
        .modal-content input[type="number"],
        .modal-content input[type="password"] {
            width: 100%; padding: 8px 10px; margin: 6px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;
        }
        .modal-buttons {
            display: flex; gap: 10px; justify-content: center; margin-top: 15px;
        }
        .btn-guardar { background-color: #0284c7; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-cancelar { background-color: #e11d48; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <button onclick="abrirAdmin()" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #1e293b; color: #fff; border: 2px solid #38bdf8; padding: 10px 15px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        ⚙️ Admin
    </button>

    <div class="header-rifa">
        <div class="dado-flotante">🎲</div>
        <div class="marca-rifa">Rifa MKDdigital</div>
        <h1 class="titulo-rifa" id="tituloLoteria">
            <span style="color: #f59e0b;">GRAN RIFA</span> CHONTICO NOCHE
        </h1>
        <div class="caja-info">
            <p id="fechaActual" style="margin: 0; font-size: 13px; color: #e2e8f0; font-weight: 600;">📅 Fecha: Calculando...</p>
            <div style="height: 1px; background: #475569; width: 100%;"></div>
            <p id="horarioSorteo" style="margin: 0; font-size: 14px; font-weight: 800; color: #fbbf24;">🕒 Sorteo: Cargando...</p>
            <div style="height: 1px; background: #475569; width: 100%;"></div>
            <p id="precioBoletoHeader" style="margin: 0; font-size: 14px; font-weight: 800; color: #34d399;">💰 Valor Boleto: Cargando...</p>
        </div>
    </div>

    <div id="grid-boletos"></div>

    <script>
        let configGlobal = {
            loteria_nombre: "Chontico Noche",
            sorteo_horario: "Lunes a Viernes - 7:00 p.m.",
            precio_boleto: 10000,
            nequi_numero: "3150000000"
        };

        function obtenerHorarioChontico() {
            const ahora = new Date();
            const dia = ahora.getDay(); // 0: Domingo, 1: Lunes, ..., 6: Sábado
            const diasNombres = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            const nombreDia = diasNombres[dia];

            let hora = "7:00 p.m.";
            if (dia === 6) {
                hora = "10:00 p.m."; // Sábado 
            } else if (dia === 0) {
                hora = "8:00 p.m."; // Domingo 
            }

            return {
                dia: nombreDia,
                horario: `${nombreDia} - ${hora}`
            };
        }

        async function cargarConfiguracion() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data && data.loteria_nombre) {
                    configGlobal = data;
                    document.getElementById('tituloLoteria').innerHTML = `<span style="color: #f59e0b;">GRAN RIFA</span> ${data.loteria_nombre}`;
                    document.getElementById('precioBoletoHeader').textContent = `💰 Valor Boleto: $${Number(data.precio_boleto).toLocaleString()}`;
                }
            } catch (e) {
                console.error("Error al cargar configuración dinámica:", e);
            }
            
            // Aplicar el horario automático basado en el día actual
            const horarioInfo = obtenerHorarioChontico();
            document.getElementById('horarioSorteo').textContent = `🕒 Sorteo: ${configGlobal.loteria_nombre} (${horarioInfo.horario})`;
        }

        function actualizarFecha() {
            const ahora = new Date();
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fechaActual').textContent = "📅 Fecha: " + ahora.toLocaleDateString('es-ES', opcionesFecha);
            
            // Refrescar también el horario automático en caso de cambio de día en vivo
            const horarioInfo = obtenerHorarioChontico();
            document.getElementById('horarioSorteo').textContent = `🕒 Sorteo: ${configGlobal.loteria_nombre} (${horarioInfo.horario})`;
        }
        
        actualizarFecha();
        setInterval(actualizarFecha, 60000);

        async function renderizarBoletos() {
            try {
                const res = await fetch('/api/boletos');
                const estadoBoletos = await res.json();
                const contenedor = document.getElementById('grid-boletos');
                if (!contenedor) return;

                contenedor.innerHTML = '';
                for (let i = 0; i < 100; i++) {
                    const numeroStr = String(i).padStart(2, '0');
                    const boletoData = estadoBoletos[numeroStr];
                    
                    let estadoLim = 'DISPONIBLE';
                    if (boletoData && typeof boletoData === 'object') {
                        estadoLim = (boletoData.estado || 'DISPONIBLE').toUpperCase();
                    }
                    
                    let claseCss = 'disponible';
                    let textoEstado = 'Disponible';

                    if (estadoLim === 'RESERVADO') {
                        claseCss = 'reservado';
                        textoEstado = 'Reservado';
                    } else if (estadoLim === 'PAGADO' || estadoLim === 'JUGANDO') {
                        claseCss = 'pagado';
                        textoEstado = 'Jugando';
                    }
                    
                    const div = document.createElement('div');
                    div.className = `ticket ${claseCss}`;
                    div.innerHTML = `<strong>${numeroStr}</strong><span class="estado-texto">${textoEstado}</span>`;
                    
                    if (claseCss === 'disponible') {
                        div.onclick = () => abrirModalReserva(numeroStr);
                    }
                    contenedor.appendChild(div);
                }
            } catch (e) {
                console.error("Error al sincronizar boletos:", e);
            }
        }

        function abrirModalReserva(numeroBoleto) {
            if (document.getElementById('modal-comprador')) document.getElementById('modal-comprador').remove();

            const horarioInfo = obtenerHorarioChontico();

            const modalHtml = `
                <div id="modal-comprador" class="modal">
                    <div class="modal-content">
                        <h2 style="text-align: center; margin-top:0;">${configGlobal.loteria_nombre} 🎟️</h2>
                        <h3 style="text-align: center; color: #0284c7;">Reservar Boleto: #${numeroBoleto}</h3>
                        <p style="font-size: 13px; color: #555; text-align: center;">
                            Valor: <strong>$${Number(configGlobal.precio_boleto).toLocaleString()}</strong>. Paga vía Nequi al <strong>${configGlobal.nequi_numero}</strong>. Tienes <strong>5 minutos</strong>.
                        </p>
                        <form id="form-reserva">
                            <input type="text" id="nombre" placeholder="Nombre completo" required />
                            <input type="tel" id="telefono" placeholder="Teléfono / WhatsApp (ej: 3001234567)" required />
                            <input type="text" id="ciudad" placeholder="Ciudad" required />
                            <input type="email" id="email" placeholder="Correo electrónico" required />
                            
                            <div style="margin: 10px 0; font-size: 12px; display: flex; align-items: flex-start; gap: 8px;">
                                <input type="checkbox" id="acepta-datos" required style="margin-top: 3px;" />
                                <label for="acepta-datos" style="cursor: pointer; color: #334155;">
                                    Autorizo el tratamiento de mis datos personales para gestionar esta rifa.
                                </label>
                            </div>

                            <div class="modal-buttons">
                                <button type="submit" class="btn-guardar">Reservar (5 min)</button>
                                <button type="button" id="btn-cancelar" class="btn-cancelar">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('btn-cancelar').onclick = () => document.getElementById('modal-comprador').remove();
            
            document.getElementById('form-reserva').onsubmit = async (e) => {
                e.preventDefault();
                const datos = {
                    numero: numeroBoleto,
                    nombre: document.getElementById('nombre').value,
                    telefono: document.getElementById('telefono').value,
                    ciudad: document.getElementById('ciudad').value,
                    email: document.getElementById('email').value,
                    loteria: configGlobal.loteria_nombre,
                    horaSorteo: horarioInfo.horario,
                    acepta_datos: document.getElementById('acepta-datos').checked
                };

                try {
                    const respuesta = await fetch('/api/reservar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datos)
                    });
                    const resultado = await respuesta.json();
                    if (!respuesta.ok) throw new Error(resultado.error || "Error al reservar");
                    
                    document.getElementById('modal-comprador').remove();
                    alert(`¡Boleto #${numeroBoleto} reservado temporalmente!`);
                    renderizarBoletos();
                } catch (error) {
                    alert(error.message);
                }
            };
        }

        function abrirAdmin() {
            if (document.getElementById('modalAdmin')) document.getElementById('modalAdmin').remove();

            const modalAdminHtml = `
                <div id="modalAdmin" class="modal">
                    <div class="modal-content">
                        <h3 style="text-align:center; color:#1e293b; margin-top:0;">Panel de Administración ⚙️</h3>
                        
                        <div id="divLogin">
                            <p style="font-size:13px;">Ingrese contraseña de acceso:</p>
                            <div style="position: relative; display: flex; align-items: center; margin: 8px 0;">
                                <input type="password" id="inputPassword" placeholder="Contraseña" style="width: 100%; padding-right: 35px; margin: 0;" />
                                <span onclick="togglePassword()" id="iconoOjo" style="position: absolute; right: 10px; cursor: pointer; user-select: none; font-size: 16px;">👁️</span>
                            </div>
                            <div class="modal-buttons">
                                <button type="button" class="btn-guardar" onclick="verificarPassword()">Ingresar</button>
                                <button type="button" class="btn-cancelar" onclick="document.getElementById('modalAdmin').remove()">Cerrar</button>
                            </div>
                        </div>

                        <div id="divContenidoAdmin" style="display: none;">
                            <h4 style="color: #333; margin-bottom: 5px;">⚙️ Configurar Rifa</h4>
                            <label style="font-size:11px; font-weight:bold;">Nombre Lotería:</label>
                            <input type="text" id="adminLoteria" value="${configGlobal.loteria_nombre}" />
                            
                            <label style="font-size:11px; font-weight:bold;">Horario Sorteo (Texto Base):</label>
                            <input type="text" id="adminHorario" value="${configGlobal.sorteo_horario}" />
                            
                            <label style="font-size:11px; font-weight:bold;">Precio Boleto ($):</label>
                            <input type="number" id="adminPrecio" value="${configGlobal.precio_boleto}" />
                            
                            <label style="font-size:11px; font-weight:bold;">Número Nequi:</label>
                            <input type="text" id="adminNequi" value="${configGlobal.nequi_numero}" />

                            <button type="button" class="btn-guardar" onclick="guardarConfiguracionAdmin()" style="margin-top: 5px;">Guardar Cambios</button>

                            <h4 style="color: #333; margin: 15px 0 5px 0;">🎟️ Reservas Pendientes</h4>
                            <div id="listaReservados" style="max-height: 120px; overflow-y: auto; font-size: 12px; border: 1px solid #cbd5e1; padding: 6px; border-radius: 6px;">Cargando...</div>
                            
                            <div style="margin-top: 10px; border-top: 1px solid #cbd5e1; padding-top: 8px;">
                                <h4 style="color: #333; margin-bottom: 3px;">🔑 Cambiar Clave Admin</h4>
                                <input type="password" id="nuevaPassword" placeholder="Nueva contraseña" />
                                <button type="button" class="btn-guardar" onclick="actualizarPassword()" style="margin-top: 3px;">Actualizar Clave</button>
                            </div>

                            <div class="modal-buttons" style="margin-top: 12px;">
                                <button type="button" class="btn-cancelar" onclick="document.getElementById('modalAdmin').remove()">Salir</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalAdminHtml);
        }

        function togglePassword() {
            const input = document.getElementById('inputPassword');
            const icono = document.getElementById('iconoOjo');
            if (input.type === 'password') {
                input.type = 'text';
                icono.textContent = '🙈';
            } else {
                input.type = 'password';
                icono.textContent = '👁️';
            }
        }

        async function verificarPassword() {
            const password = document.getElementById('inputPassword').value;
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('divLogin').style.display = 'none';
                    document.getElementById('divContenidoAdmin').style.display = 'block';
                    cargarReservadosAdmin();
                } else {
                    alert('Contraseña incorrecta');
                }
            } catch (e) {
                alert('Error al verificar credenciales.');
            }
        }

        async function guardarConfiguracionAdmin() {
            const datosConfig = {
                loteria_nombre: document.getElementById('adminLoteria').value,
                sorteo_horario: document.getElementById('adminHorario').value,
                precio_boleto: document.getElementById('adminPrecio').value,
                nequi_numero: document.getElementById('adminNequi').value
            };

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosConfig)
                });
                const data = await res.json();
                if (data.success) {
                    alert('¡Configuración actualizada con éxito!');
                    await cargarConfiguracion();
                    document.getElementById('modalAdmin').remove();
                } else {
                    alert('Error al guardar configuración.');
                }
            } catch (e) {
                alert('Error de conexión con el servidor.');
            }
        }

        async function actualizarPassword() {
            const nuevaPassword = document.getElementById('nuevaPassword').value;
            if (!nuevaPassword || nuevaPassword.trim() === "") {
                alert("Por favor ingresa una contraseña válida.");
                return;
            }
            try {
                const res = await fetch('/api/admin/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nuevaPassword })
                });
                const data = await res.json();
                if (data.success) {
                    alert("¡Contraseña actualizada con éxito!");
                    document.getElementById('nuevaPassword').value = "";
                } else {
                    alert(data.error || "No se pudo actualizar la contraseña.");
                }
            } catch (e) {
                alert("Error de conexión.");
            }
        }

        async function cargarReservadosAdmin() {
            const contenedor = document.getElementById('listaReservados');
            contenedor.innerHTML = 'Cargando...';
            try {
                const res = await fetch('/api/boletos', { cache: 'no-store' });
                const dataBoletos = await res.json();

                let html = '';
                for (const [id, boleto] of Object.entries(dataBoletos)) {
                    if (typeof boleto === 'object' && boleto !== null && boleto.estado === 'RESERVADO') {
                        html += `<div style="padding: 4px 0; border-bottom: 1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
                            <span><b>#${id}</b> - ${boleto.nombre || 'Reservado'}</span>
                            <button onclick="aprobarPagoAdmin('${id}')" style="background:#059669; color:#fff; border:none; padding:3px 6px; border-radius:4px; cursor:pointer; font-size:11px;">Aprobar</button>
                        </div>`;
                    }
                }
                contenedor.innerHTML = html || '<p>No hay reservas activas.</p>';
            } catch (error) {
                contenedor.innerHTML = '<p style="color: red;">Error al cargar datos.</p>';
            }
        }

        async function aprobarPagoAdmin(numero) {
            try {
                const res = await fetch(`/api/pagar/${numero}`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    alert(`¡Boleto #${numero} aprobado exitosamente!`);
                    
                    const resBoletos = await fetch('/api/boletos');
                    const estadoBoletos = await resBoletos.json();
                    const boletoInfo = estadoBoletos[numero] || {};
                    const horarioInfo = obtenerHorarioChontico();
                    
                    const nombreCliente = boletoInfo.nombre || 'Cliente';
                    const telefonoCliente = boletoInfo.telefono || '';
                    const codigoSeguridad = 'MKD-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + numero;

                    const mensaje = `============================\n COMPROBANTE OFICIAL DE RIFA   \n============================\n\n¡Hola ${nombreCliente}! Tu pago del boleto *${numero}* para la *${configGlobal.loteria_nombre}* ha sido confirmado.\n\n[+] Detalles:\n - Lotería: ${configGlobal.loteria_nombre}\n - Horario: ${horarioInfo.horario}\n - Código Antifraude: ${codigoSeguridad}\n\n¡Muchísima suerte!`;
                    
                    if (telefonoCliente) {
                        const telefonoLimpiado = telefonoCliente.replace(/\D/g, '');
                        window.open(`https://wa.me/${telefonoLimpiado}?text=${encodeURIComponent(mensaje)}`, '_blank');
                    }

                    cargarReservadosAdmin();
                    renderizarBoletos();
                } else {
                    alert('No se pudo aprobar el pago.');
                }
            } catch (e) {
                alert('Error de conexión con el servidor.');
            }
        }

        window.onload = async () => {
            await cargarConfiguracion();
            await renderizarBoletos();
        };
    </script>
</body>
</html>
