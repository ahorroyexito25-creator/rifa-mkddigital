<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa MKDdigital 🎟️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #cbd5e1;
            margin: 0;
            padding: 0;
            color: #0f172a;
        }

        .header-rifa {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid #f59e0b;
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.7);
            position: relative;
            z-index: 10;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .dado-flotante {
            display: inline-block;
            font-size: 38px;
            animation: float 3s ease-in-out infinite;
            margin-bottom: 2px;
        }

        .marca-rifa {
            font-size: 13px;
            letter-spacing: 3px;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .titulo-rifa {
            margin: 0 0 15px 0;
            font-family: 'Impact', Charcoal, sans-serif;
            font-size: 38px;
            font-weight: 400;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 5px 0 rgba(0,0,0,0.5), 0 10px 10px rgba(0,0,0,0.8);
        }

        .caja-info {
            display: inline-flex;
            flex-direction: column;
            gap: 8px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
            padding: 15px 25px;
            border-radius: 20px;
            border: 2px solid #475569;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 5px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        #grid-boletos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 12px;
            padding: 25px;
            max-width: 950px;
            margin: 0 auto;
        }

        .ticket {
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            padding: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .disponible { 
            background-color: #059669; 
            color: #ffffff; 
            border: 1px solid #000000;
        }
        .disponible:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            background-color: #047857;
        }

        .reservado { 
            background-color: #d97706; 
            color: white; 
            pointer-events: none; 
            border: 1px solid #000000;
            opacity: 0.9;
        }

        .pagado { 
            background-color: #dc2626; 
            color: white; 
            pointer-events: none; 
            border: 1px solid #000000;
            opacity: 0.9;
        }

        .estado-texto {
            font-size: 9px;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #ffffff; color: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 420px; text-align: left;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content input[type="text"],
        .modal-content input[type="tel"],
        .modal-content input[type="email"],
        .modal-content input[type="number"],
        .modal-content input[type="password"],
        .modal-content input[type="datetime-local"],
        .modal-content select {
            width: 100%; padding: 8px 10px; margin: 6px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;
        }
        .modal-buttons {
            display: flex; gap: 10px; justify-content: center; margin-top: 15px;
        }
        .btn-guardar { background-color: #0284c7; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-cancelar { background-color: #e11d48; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-whatsapp { background-color: #16a34a; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; text-decoration: none; display: inline-block; text-align: center; margin-top: 8px;}
        
        footer {
            text-align: center;
            padding: 30px 10px;
            color: #475569;
            font-size: 13px;
        }
        footer a {
            color: #334155;
            text-decoration: none;
            font-weight: 600;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header-rifa">
        <div class="dado-flotante">🎲</div>
        <div class="marca-rifa">Rifa MKDdigital</div>
        <h1 class="titulo-rifa" id="tituloLoteria">
            <span style="color: #f59e0b;">GRAN RIFA</span> CHONTICO NOCHE
        </h1>
        <div class="caja-info">
            <div id="fechaHoyHeader" style="font-size: 12px; color: #38bdf8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">📅 Hoy: Cargando...</div>
            <div style="height: 1px; background: #475569; width: 100%;"></div>
            <div id="premioHeader" style="font-size: 15px; font-weight: 800; color: #f59e0b;">🏆 Premio Mayor: Cargando...</div>
            <div style="height: 1px; background: #475569; width: 100%;"></div>
            <div id="fechaSorteoHeader" style="font-size: 13px; color: #e2e8f0; font-weight: 600;">📅 Sorteo: Cargando...</div>
            <div style="height: 1px; background: #475569; width: 100%;"></div>
            <div id="precioBoletoHeader" style="font-size: 14px; font-weight: 800; color: #34d399;">💰 Valor Boleto: Cargando...</div>
        </div>
    </div>

    <div id="grid-boletos"></div>

    <footer>
        <p>Rifa MKDDigital © 2026 - Todos los derechos reservados</p>
        <p style="margin-top: 5px;">
            <a href="#" onclick="abrirAdmin(); return false;">⚙️ Panel Administrativo</a>
        </p>
    </footer>

    <script>
        let configGlobal = {
            pais: "colombia",
            moneda: "COP",
            simbolo_moneda: "$",
            loteria_nombre: "Chontico Noche",
            fecha_sorteo: "2026-09-05T19:00",
            precio_boleto: 10000,
            premio_mayor: "700.000 $ COP",
            nequi_numero: "3150000000",
            bancolombia_numero: "000-00000-00",
            pago_movil_datos: "Banco Mercantil | Tel: 0414-0000000 | C.I: V-12345678"
        };

        window.onload = () => {
            mostrarFechaHoyDinamica();
            cargarConfiguracion().then(() => renderizarBoletos());
            setInterval(renderizarBoletos, 10000); // Sincroniza cada 10s
        };

        function mostrarFechaHoyDinamica() {
            const ahora = new Date();
            const dias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
            const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            const texto = `${dias[ahora.getDay()]} ${ahora.getDate()} de ${meses[ahora.getMonth()]} del ${ahora.getFullYear()}`.toUpperCase();
            const el = document.getElementById('fechaHoyHeader');
            if (el) el.innerHTML = `📅 Hoy: <strong>${texto}</strong>`;
        }

        function formatearFechaTexto(fechaIso) {
            if (!fechaIso) return "Por definir";
            try {
                const fecha = new Date(fechaIso);
                if (isNaN(fecha.getTime())) return fechaIso;
                return fecha.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
            } catch (e) {
                return fechaIso;
            }
        }

        async function cargarConfiguracion() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data && data.loteria_nombre) {
                    configGlobal = data;
                    document.getElementById('tituloLoteria').innerHTML = `<span style="color: #f59e0b;">GRAN RIFA</span> ${data.loteria_nombre}`;
                    document.getElementById('premioHeader').innerHTML = `🏆 Premio Mayor: ${data.premio_mayor || '700.000 $ COP'}`;
                    document.getElementById('precioBoletoHeader').textContent = `💰 Valor Boleto: ${data.simbolo_moneda || '$'}${Number(data.precio_boleto).toLocaleString()} ${data.moneda}`;
                    document.getElementById('fechaSorteoHeader').innerHTML = `📅 Fecha del Sorteo: ${formatearFechaTexto(data.fecha_sorteo)}`;
                }
            } catch (e) {
                console.error("Error al cargar configuración:", e);
            }
        }

        async function renderizarBoletos() {
            try {
                const res = await fetch('/api/boletos');
                const estadoBoletos = await res.json();
                const contenedor = document.getElementById('grid-boletos');
                if (!contenedor) return;

                contenedor.innerHTML = '';
                for (let i = 0; i < 100; i++) {
                    const numeroStr = String(i).padStart(2, '0');
                    const boletoData = estadoBoletos[numeroStr];
                    
                    let estadoLim = 'DISPONIBLE';
                    if (boletoData && typeof boletoData === 'object') {
                        estadoLim = (boletoData.estado || 'DISPONIBLE').toUpperCase();
                    }
                    
                    let claseCss = 'disponible';
                    let textoEstado = 'Disponible';

                    if (estadoLim === 'RESERVADO') {
                        claseCss = 'reservado';
                        textoEstado = 'Reservado';
                    } else if (estadoLim === 'PAGADO' || estadoLim === 'JUGANDO') {
                        claseCss = 'pagado';
                        textoEstado = 'Jugando';
                    }
                    
                    const div = document.createElement('div');
                    div.className = `ticket ${claseCss}`;
                    div.innerHTML = `<strong>${numeroStr}</strong><span class="estado-texto">${textoEstado}</span>`;
                    
                    if (claseCss === 'disponible') {
                        div.onclick = () => abrirModalReserva(numeroStr);
                    }
                    contenedor.appendChild(div);
                }
            } catch (e) {
                console.error("Error al sincronizar boletos:", e);
            }
        }

        function abrirModalReserva(numeroBoleto) {
            if (document.getElementById('modal-comprador')) document.getElementById('modal-comprador').remove();

            let infoPagoHtml = '';
            let textoQrData = '';
            if (configGlobal.pais === 'colombia' || configGlobal.moneda === 'COP') {
                infoPagoHtml = `Paga vía <b>Nequi</b> (${configGlobal.nequi_numero}) o <b>Bancolombia</b> (${configGlobal.bancolombia_numero}).`;
                textoQrData = `Nequi:${configGlobal.nequi_numero}|Bancolombia:${configGlobal.bancolombia_numero}|Valor:${configGlobal.precio_boleto}`;
            } else {
                infoPagoHtml = `Paga vía <b>Pago Móvil</b>:<br><small>${configGlobal.pago_movil_datos}</small>`;
                textoQrData = `PagoMovil:${configGlobal.pago_movil_datos}|Valor:${configGlobal.precio_boleto}`;
            }

            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(textoQrData)}`;

            const modalHtml = `
                <div id="modal-comprador" class="modal">
                    <div class="modal-content">
                        <h2 style="text-align: center; margin-top:0;">${configGlobal.loteria_nombre} 🎟️</h2>
                        <h3 style="text-align: center; color: #0284c7; margin: 5px 0;">Reservar Boleto: #${numeroBoleto}</h3>
                        <div style="text-align: center; margin: 8px 0;">
                            <img src="${qrUrl}" alt="QR Pago" style="border-radius: 6px; border: 1px solid #cbd5e1; width: 120px; height: 120px;" />
                        </div>
                        <p style="font-size: 12px; color: #334155; text-align: center; background: #f1f5f9; padding: 8px; border-radius: 6px; margin: 5px 0;">
                            Valor: <b>${configGlobal.simbolo_moneda || '$'}${Number(configGlobal.precio_boleto).toLocaleString()} ${configGlobal.moneda}</b><br>
                            ${infoPagoHtml}
                        </p>
                        <form id="form-reserva">
                            <input type="text" id="nombre" placeholder="Nombre completo" required />
                            <input type="tel" id="telefono" placeholder="Teléfono / WhatsApp (ej: +57...)" required />
                            <input type="text" id="ciudad" placeholder="Ciudad / Estado" required />
                            <input type="email" id="email" placeholder="Correo electrónico" required />
                            
                            <div style="margin: 8px 0; font-size: 11px; display: flex; align-items: flex-start; gap: 8px;">
                                <input type="checkbox" id="acepta-datos" required style="margin-top: 3px;" />
                                <label for="acepta-datos" style="cursor: pointer; color: #334155;">
                                    Autorizo el tratamiento de mis datos personales para gestionar esta rifa.
                                </label>
                            </div>

                            <div class="modal-buttons">
                                <button type="submit" class="btn-guardar">Reservar y Obtener QR</button>
                                <button type="button" id="btn-cancelar" class="btn-cancelar">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('btn-cancelar').onclick = () => document.getElementById('modal-comprador').remove();
            
            document.getElementById('form-reserva').onsubmit = async (e) => {
                e.preventDefault();
                const datos = {
                    numero: numeroBoleto,
                    nombre: document.getElementById('nombre').value,
                    telefono: document.getElementById('telefono').value,
                    ciudad: document.getElementById('ciudad').value,
                    email: document.getElementById('email').value,
                    loteria: configGlobal.loteria_nombre,
                    fechaSorteo: formatearFechaTexto(configGlobal.fecha_sorteo),
                    acepta_datos: document.getElementById('acepta-datos').checked
                };

                try {
                    const respuesta = await fetch('/api/reservar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datos)
                    });
                    const resultado = await respuesta.json();
                    if (!respuesta.ok) throw new Error(resultado.error || "Error al reservar");
                    
                    document.getElementById('modal-comprador').remove();
                    mostrarModalExitoReserva(numeroBoleto, datos.nombre, resultado.antifraude, resultado.fechaCompra);
                    renderizarBoletos();
                } catch (error) {
                    alert(error.message);
                }
            };
        }

        function mostrarModalExitoReserva(numero, nombre, antifraude, fechaCompra) {
            const mensajeWp = `¡Hola! He reservado el boleto #${numero} para la rifa ${configGlobal.loteria_nombre}.%0A- Nombre: ${nombre}%0A- Fecha: ${fechaCompra}%0A- Código Antifraude: ${antifraude}%0AAdjunto comprobante de pago.`;
            const linkWp = `https://api.whatsapp.com/send?phone=573150000000&text=${mensajeWp}`;

            const html = `
                <div class="modal" id="modal-exito">
                    <div class="modal-content" style="text-align: center;">
                        <h3 style="color: #059669; margin-top:0;">¡Boleto #${numero} Reservado!</h3>
                        <p style="font-size: 13px; color: #334155;">
                            Código Antifraude:<br>
                            <code style="font-size: 15px; background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #e11d48;">${antifraude}</code>
                        </p>
                        <p style="font-size: 12px; color: #475569;">Reporta tu pago inmediatamente enviando el comprobante por WhatsApp al administrador.</p>
                        <a href="${linkWp}" target="_blank" class="btn-whatsapp">📲 Enviar Comprabante por WhatsApp</a>
                        <button type="button" class="btn-guardar" style="margin-top: 10px;" onclick="document.getElementById('modal-exito').remove()">Cerrar</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function abrirAdmin() {
            if (document.getElementById('modalAdmin')) document.getElementById('modalAdmin').remove();

            const modalAdminHtml = `
                <div id="modalAdmin" class="modal">
                    <div class="modal-content">
                        <h3 style="text-align:center; color:#1e293b; margin-top:0;">Panel de Administración ⚙️</h3>
                        
                        <div id="divLogin">
                            <p style="font-size:13px;">Ingrese contraseña de acceso:</p>
                            <div style="position: relative; display: flex; align-items: center; margin: 8px 0;">
                                <input type="password" id="inputPassword" placeholder="Contraseña" style="width: 100%; padding-right: 35px; margin: 0;" />
                                <span onclick="togglePassword()" id="iconoOjo" style="position: absolute; right: 10px; cursor: pointer; font-size: 16px;">👁️</span>
                            </div>
                            <div class="modal-buttons">
                                <button type="button" class="btn-guardar" onclick="verificarPassword()">Ingresar</button>
                                <button type="button" class="btn-cancelar" onclick="document.getElementById('modalAdmin').remove()">Cerrar</button>
                            </div>
                        </div>

                        <div id="divContenidoAdmin" style="display: none;">
                            <h4 style="color: #333; margin-bottom: 5px;">🌍 Selección de Mercado / País</h4>
                            <select id="adminPais" onchange="cambiarPlantillaPais()" class="input-control">
                                <option value="colombia">Colombia (COP - Nequi / Bancolombia)</option>
                                <option value="venezuela_ves">Venezuela (Bolívares - Pago Móvil)</option>
                                <option value="venezuela_usd">Venezuela (Dólares USD - Divisas)</option>
                            </select>

                            <h4 style="color: #333; margin: 10px 0 5px 0;">⚙️ Configuración General</h4>
                            <label style="font-size:11px; font-weight:bold;">Nombre Lotería:</label>
                            <input type="text" id="adminLoteria" value="${configGlobal.loteria_nombre}" />
                            
                            <label style="font-size:11px; font-weight:bold;">Premio Mayor:</label>
                            <input type="text" id="adminPremio" value="${configGlobal.premio_mayor}" />

                            <label style="font-size:11px; font-weight:bold;">Fecha y Hora del Sorteo:</label>
                            <input type="datetime-local" id="adminFechaSorteo" value="${configGlobal.fecha_sorteo || ''}" />

                            <label style="font-size:11px; font-weight:bold;">Precio del Boleto:</label>
                            <input type="number" id="adminPrecio" value="${configGlobal.precio_boleto}" />

                            <label style="font-size:11px; font-weight:bold;">Símbolo Moneda ($ / Bs):</label>
                            <input type="text" id="adminSimbolo" value="${configGlobal.simbolo_moneda}" />

                            <label style="font-size:11px; font-weight:bold;">Código Moneda (COP / VES / USD):</label>
                            <input type="text" id="adminMoneda" value="${configGlobal.moneda}" />

                            <h4 style="color: #333; margin: 10px 0 5px 0;">💳 Datos de Pago</h4>
                            <label style="font-size:11px; font-weight:bold;">Número Nequi:</label>
                            <input type="text" id="adminNequi" value="${configGlobal.nequi_numero}" />

                            <label style="font-size:11px; font-weight:bold;">Número Bancolombia:</label>
                            <input type="text" id="adminBancolombia" value="${configGlobal.bancolombia_numero}" />

                            <label style="font-size:11px; font-weight:bold;">Datos Pago Móvil (Venezuela):</label>
                            <input type="text" id="adminPagoMovil" value="${configGlobal.pago_movil_datos}" />

                            <button type="button" class="btn-guardar" onclick="guardarConfiguracionAdmin()" style="margin-top: 10px;">Guardar Cambios</button>

                            <h4 style="color: #333; margin: 15px 0 5px 0;">🎟️ Gestionar Boletos</h4>
                            <div id="listaReservados" style="max-height: 140px; overflow-y: auto; font-size: 11px; border: 1px solid #cbd5e1; padding: 6px; border-radius: 6px;">Cargando...</div>
                            
                            <div style="margin-top: 10px; border-top: 1px solid #cbd5e1; padding-top: 8px;">
                                <h4 style="color: #333; margin-bottom: 3px;">🔑 Cambiar Clave Admin</h4>
                                <input type="password" id="nuevaPassword" placeholder="Nueva contraseña" />
                                <button type="button" class="btn-guardar" onclick="actualizarPassword()" style="margin-top: 3px;">Actualizar Clave</button>
                            </div>

                            <div class="modal-buttons" style="margin-top: 12px;">
                                <button type="button" class="btn-cancelar" onclick="document.getElementById('modalAdmin').remove()">Salir</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalAdminHtml);
            document.getElementById('adminPais').value = configGlobal.pais || 'colombia';
        }

        function cambiarPlantillaPais() {
            const paisSel = document.getElementById('adminPais').value;
            if (paisSel === 'colombia') {
                document.getElementById('adminMoneda').value = 'COP';
                document.getElementById('adminSimbolo').value = '$';
                document.getElementById('adminPrecio').value = '10000';
                document.getElementById('adminPremio').value = '700.000 $ COP';
                document.getElementById('adminLoteria').value = 'Chontico Noche';
            } else if (paisSel === 'venezuela_ves') {
                document.getElementById('adminMoneda').value = 'VES';
                document.getElementById('adminSimbolo').value = 'Bs. ';
                document.getElementById('adminPrecio').value = '50';
                document.getElementById('adminPremio').value = '5.000 Bs.';
                document.getElementById('adminLoteria').value = 'Triple Táchira';
            } else if (paisSel === 'venezuela_usd') {
                document.getElementById('adminMoneda').value = 'USD';
                document.getElementById('adminSimbolo').value = '$';
                document.getElementById('adminPrecio').value = '3';
                document.getElementById('adminPremio').value = '$300 USD';
                document.getElementById('adminLoteria').value = 'Lotería de Animalitos';
            }
        }

        function togglePassword() {
            const input = document.getElementById('inputPassword');
            const icono = document.getElementById('iconoOjo');
            if (input.type === 'password') {
                input.type = 'text';
                icono.textContent = '🙈';
            } else {
                input.type = 'password';
                icono.textContent = '👁️';
            }
        }

        async function verificarPassword() {
            const password = document.getElementById('inputPassword').value;
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('divLogin').style.display = 'none';
                    document.getElementById('divContenidoAdmin').style.display = 'block';
                    cargarListaAdminBoletos();
                } else {
                    alert("Contraseña incorrecta");
                }
            } catch (e) {
                alert("Error de conexión");
            }
        }

        async function cargarListaAdminBoletos() {
            try {
                const res = await fetch('/api/boletos');
                const boletos = await res.json();
                const contenedor = document.getElementById('listaReservados');
                let html = '';
                
                const keys = Object.keys(boletos);
                if (keys.length === 0) {
                    contenedor.innerHTML = 'No hay boletos reservados o pagados.';
                    return;
                }

                keys.forEach(num => {
                    const b = boletos[num];
                    html += `<div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding: 4px 0;">
                        <span><b>#${num}</b> - ${b.nombre} (${b.estado})</span>
                        <div>
                            ${b.estado === 'RESERVADO' ? `<button onclick="marcarPagado('${num}')" style="background:#16a34a;color:white;border:none;padding:2px 6px;border-radius:4px;cursor:pointer;">Aprobar</button>` : ''}
                            <button onclick="liberarBoleto('${num}')" style="background:#dc2626;color:white;border:none;padding:2px 6px;border-radius:4px;cursor:pointer;margin-left:4px;">Liberar</button>
                        </div>
                    </div>`;
                });
                contenedor.innerHTML = html;
            } catch (e) {
                console.error(e);
            }
        }

        async function marcarPagado(numero) {
            await fetch(`/api/pagar/${numero}`, { method: 'POST' });
            cargarListaAdminBoletos();
            renderizarBoletos();
        }

        async function liberarBoleto(numero) {
            if (!confirm(`¿Liberar boleto #${numero}?`)) return;
            await fetch(`/api/admin/liberar/${numero}`, { method: 'POST' });
            cargarListaAdminBoletos();
            renderizarBoletos();
        }

        async function guardarConfiguracionAdmin() {
            const nuevaConfig = {
                pais: document.getElementById('adminPais').value,
                moneda: document.getElementById('adminMoneda').value,
                simbolo_moneda: document.getElementById('adminSimbolo').value,
                loteria_nombre: document.getElementById('adminLoteria').value,
                fecha_sorteo: document.getElementById('adminFechaSorteo').value,
                precio_boleto: Number(document.getElementById('adminPrecio').value),
                premio_mayor: document.getElementById('adminPremio').value,
                nequi_numero: document.getElementById('adminNequi').value,
                bancolombia_numero: document.getElementById('adminBancolombia').value,
                pago_movil_datos: document.getElementById('adminPagoMovil').value
            };

            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevaConfig)
            });
            if (res.ok) {
                alert("Configuración guardada correctamente");
                document.getElementById('modalAdmin').remove();
                cargarConfiguracion();
            } else {
                alert("Error al guardar");
            }
        }

        async function actualizarPassword() {
            const nuevaPassword = document.getElementById('nuevaPassword').value;
            if (!nuevaPassword) return alert("Ingrese una contraseña válida");
            const res = await fetch('/api/admin/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nuevaPassword })
            });
            if (res.ok) {
                alert("Contraseña actualizada con éxito");
                document.getElementById('nuevaPassword').value = '';
            } else {
                alert("Error al actualizar contraseña");
            }
        }
    </script>
</body>
</html>
